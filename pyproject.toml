[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "networkpulse-ai"
version = "0.5.0"
description = "Explainable network-flow observability, anomaly scoring, and investigation platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Neloy Pramanik Supto"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "joblib>=1.4,<2",
  "httpx>=0.27,<1",
  "PyJWT[crypto]>=2.9,<3",
  "cryptography>=50,<51",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.7,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]
streaming = ["redis>=5,<7"]

[project.scripts]
networkpulse = "networkpulse.cli:main"

[tool.setuptools.packages.find]
include = ["networkpulse*"]

[tool.setuptools.package-data]
networkpulse = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
