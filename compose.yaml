services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: networkpulse
      POSTGRES_USER: networkpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U networkpulse -d networkpulse"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
    networks: [internal]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    profiles: ["streaming"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]
  worker:
    build: .
    profiles: ["streaming"]
    command: ["networkpulse", "worker", "--consumer", "compose-worker-1"]
    # Both a recent successful processing cycle and live Redis are required;
    # Redis PING alone cannot detect a stuck DB/model worker.
    healthcheck:
      test: ["CMD", "sh", "-ec", "python -m networkpulse.ops_health --role stream --path /tmp/networkpulse-stream-heartbeat.json --max-age-seconds 120 && python -c \"import os, redis; assert redis.Redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=2, socket_timeout=2).ping()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://networkpulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/networkpulse
      NETWORKPULSE_API_KEY: ${NETWORKPULSE_API_KEY:?Set NETWORKPULSE_API_KEY in .env}
      MODEL_PATH: /app/data/model.joblib
    volumes:
      - model_data:/app/data:ro
    networks: [internal]
  mlops-worker:
    build: .
    profiles: ["streaming"]
    command: ["networkpulse", "mlops-monitor", "--interval", "300",
              "--lookback-hours", "3", "--delay-minutes", "10"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "networkpulse.ops_health", "--role", "mlops", "--path", "/tmp/networkpulse-mlops-heartbeat.json", "--max-age-seconds", "900"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://networkpulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/networkpulse
      NETWORKPULSE_API_KEY: ${NETWORKPULSE_API_KEY:?Set NETWORKPULSE_API_KEY in .env}
      MODEL_PATH: /app/data/model.joblib
      MODEL_SHA256: ${MODEL_SHA256:?Set verified deployed model SHA256 in .env}
    volumes:
      - model_data:/app/data:ro
    networks: [internal]
  behavior-worker:
    build: .
    profiles: ["streaming"]
    command: ["networkpulse", "behavior-worker", "--interval", "60",
              "--lookback", "30", "--lateness", "2"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "networkpulse.ops_health", "--role", "behavior", "--path", "/tmp/networkpulse-behavior-heartbeat.json", "--max-age-seconds", "180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://networkpulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/networkpulse
      NETWORKPULSE_API_KEY: ${NETWORKPULSE_API_KEY:?Set NETWORKPULSE_API_KEY in .env}
    networks: [internal]
  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://networkpulse:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/networkpulse
      NETWORKPULSE_API_KEY: ${NETWORKPULSE_API_KEY:?Set NETWORKPULSE_API_KEY in .env}
      MODEL_PATH: /app/data/model.joblib
      REDIS_METRICS_URL: redis://redis:6379/0
    volumes:
      - model_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    networks: [internal]
volumes:
  db_data:
  model_data:
  redis_data:
networks:
  internal:
