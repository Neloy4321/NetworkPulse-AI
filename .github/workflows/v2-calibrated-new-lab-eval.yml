name: V2 calibrated frozen model 2-new-capture lab transfer (NOT P0)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/v2-calibrated-new-lab-eval.yml'
      - 'networkpulse/evaluation/v2_source_calibration.py'
      - 'tests/test_v2_source_calibration.py'
      - 'networkpulse/evaluation/v2_calibrated_new_lab_eval.py'
      - 'tests/test_v2_calibrated_new_lab_eval.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-new-lab-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible research packages
        run: python -m pip install -e '.[dev]' 'boto3>=1.34,<2'
      - name: Lint predeclared source calibration
        run: >-
          python -m ruff check networkpulse/evaluation/v2_source_calibration.py
          networkpulse/evaluation/v2_calibrated_new_lab_eval.py
          tests/test_v2_source_calibration.py
          tests/test_v2_calibrated_new_lab_eval.py
      - name: Test source group and mathematical gate behavior
        run: >-
          python -m pytest -q tests/test_v2_source_calibration.py
          tests/test_v2_calibrated_new_lab_eval.py
      - name: Acquire approved UNSW DEVELOPMENT source bytes (not a new holdout)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          from networkpulse.evaluation.native_cross_dataset_sources import _archives
          from networkpulse.evaluation.private_r2_sources import (
              _configured_client, stream_verified_object,
          )
          archive = _archives()[0]
          if archive.name != "unsw-source.zip":
              raise SystemExit("Unexpected original source identity")
          stream_verified_object(_configured_client(), archive)
          print("Full UNSW source SHA pinned; source DEV only")
          PY
      - name: Fetch only previously exposed IoT 34-1 DEVELOPMENT capture
        run: |
          python - <<'PY'
          import hashlib
          import os
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.iot23v2_source_adapter import SOURCE_URL
          from networkpulse.evaluation.iot23v2_exact_runtime_recheck import (
              SOURCE_BYTES, SOURCE_SHA256,
          )
          with urlopen(Request(SOURCE_URL, headers={
              "User-Agent": "NetworkPulse-AI-research/1.0"
          }), timeout=120) as response:
              content = response.read(SOURCE_BYTES + 1)
          if len(content) != SOURCE_BYTES or hashlib.sha256(content).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Previously exposed source SHA changed")
          fd = os.open("private-iot34-development.labeled", os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,"wb") as target:
              target.write(content)
          print("Source calibration contains NO Hakai/Torii/TON evaluation labels")
          PY
      - name: Fit source-only candidate and calibrate with strict FPR margin
        run: >-
          python -m networkpulse.evaluation.v2_source_calibration
          --unsw-zip unsw-source.zip
          --iot23-source private-iot34-development.labeled
          --research-model private-calibration/research-only-v2-calibrated.joblib
          --report aggregate-calibration/v2-source-calibration.json
      - name: Fail closed on false operational acceptance claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("aggregate-calibration/v2-source-calibration.json").read_text())
          if (r.get("operational_ml_acceptance") != "NO_GO"
              or r.get("independent_operator_site_verified") is not False
              or r.get("production_model_signed_and_deployed") is not False
              or r.get("selected",{}).get("untouched_holdout_scored") is not False):
              raise SystemExit("Exposed source calibration cannot be a production approval")
          choice = r["selected"]
          if choice["cutoff"] is not None:
              if choice["source_cal_confusion"]["source_cal_fpr_upper95"] > 0.025:
                  raise SystemExit("Attempt to weaken predeclared source safety budget")
              print("Research-only source-calibrated cutoff:", choice["cutoff"],
                    "source recall lower goal:", choice["source_cal_recall_lower_goal_met"])
          else:
              print("No cutoff met source FPR budget, remain NO_GO")
          PY
      - name: Require previously published calibrated model SHA before opening new sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from networkpulse.evaluation.unsw_to_toniot import digest
          from networkpulse.evaluation.v2_calibrated_new_lab_eval import FROZEN_MODEL_SHA256, CUTOFF
          artifact = Path("private-calibration/research-only-v2-calibrated.joblib")
          manifest = json.loads(Path("aggregate-calibration/v2-source-calibration.json").read_text())
          assert digest(artifact) == FROZEN_MODEL_SHA256
          assert manifest["artifact_sha256"] == FROZEN_MODEL_SHA256
          assert manifest["protocol"]["threshold"] == CUTOFF
          assert manifest["operational_ml_acceptance"] == "NO_GO"
          print("Previously frozen model and fixed cutoff verified BEFORE any fresh target labels")
          PY
      - name: Download BOTH preregistered official benign and malware lab scenarios
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.v2_calibrated_new_lab_eval import CAPTURES
          root = "https://mcfp.felk.cvut.cz/publicDatasets/IoT-23-Dataset-v2/"
          for scenario, filename in CAPTURES.items():
              url = root + scenario + "/" + filename
              with urlopen(Request(url, headers={
                  "User-Agent": "NetworkPulse-AI-academic-research/1.0",
              }), timeout=120) as response:
                  if response.status != 200:
                      raise SystemExit("Official preregistered capture URL unavailable")
                  content = response.read(10_000_001)
              if not (0 < len(content) <= 10_000_000):
                  raise SystemExit("Research capture exceeded allowed byte budget")
              # Hash checked before any parser inspects target label cells.
              target = Path(filename)
              fd = os.open(target, os.O_CREAT|os.O_EXCL|os.O_WRONLY, 0o600)
              with os.fdopen(fd,"wb") as handle:
                  handle.write(content)
              print(scenario, "sha256-before-labels", hashlib.sha256(content).hexdigest())
          PY
      - name: Independently score fixed model without refitting or threshold selection
        run: >-
          python -m networkpulse.evaluation.v2_calibrated_new_lab_eval
          --model private-calibration/research-only-v2-calibrated.joblib
          --manifest aggregate-calibration/v2-source-calibration.json
          --trojan-42 2019-01-10-14-34-38-192.168.1.197-zeek-conn-log.labeled
          --benign-4 2018-10-25-14-06-32-192.168.1.132-zeek-conn.log.labeled
          --aggregate-output aggregate-calibration/two-fresh-lab-captures.json
      - name: Reject promotion based on same-laboratory validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          file = Path("aggregate-calibration/two-fresh-lab-captures.json")
          data = json.loads(file.read_text())
          assert data["status"] == "predeclared_exposed_after_scoring_laboratory_transfer"
          assert data["target_labels_used_to_fit_tune_or_choose_threshold"] is False
          assert data["independent_operator_site_verified"] is False
          assert data["actual_active_signed_deployment_verified"] is False
          assert data["p0_operational_ml_acceptance"] == "NO_GO"
          assert len(data["captures"]) == 2
          print("Both preregistered captures measured; operational P0 remains NO_GO")
          PY
      - name: Preserve source-only aggregate calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-two-new-captures-fixed-calibrated-model-research-only
          path: |
            aggregate-calibration/v2-source-calibration.json
            aggregate-calibration/two-fresh-lab-captures.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve unsigned research-only calibrated model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v2-unsigned-calibrated-candidate-for-lab-comparison
          path: private-calibration/research-only-v2-calibrated.joblib
          retention-days: 14
          if-no-files-found: warn
      - name: Purge sensitive raw flow input and candidate from runner
        if: always()
        run: |
          rm -f unsw-source.zip private-iot34-development.labeled
          rm -f private-calibration/research-only-v2-calibrated.joblib
          rm -f 2019-01-10-14-34-38-192.168.1.197-zeek-conn-log.labeled
          rm -f 2018-10-25-14-06-32-192.168.1.132-zeek-conn.log.labeled

# Intentionally no untouched target scoring or active production deployment.
