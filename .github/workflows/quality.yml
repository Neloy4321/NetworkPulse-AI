name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: networkpulse_ci
          POSTGRES_USER: networkpulse_ci
          POSTGRES_PASSWORD: local-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U networkpulse_ci -d networkpulse_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/1
      PG_TEST_DATABASE_URL: postgresql+psycopg://networkpulse_ci:local-ci-test-password@127.0.0.1:5432/networkpulse_ci
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev,postgres,streaming]'
      - name: Check formatting and common correctness issues
        run: ruff check networkpulse tests alembic
      - name: Run automated tests with coverage
        run: pytest --cov=networkpulse --cov-report=term-missing
      - name: Compile all modules
        run: python -m compileall -q networkpulse alembic
