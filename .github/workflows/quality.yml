name: Quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check formatting and common correctness issues
        run: ruff check networkpulse tests
      - name: Run automated tests with coverage
        run: pytest --cov=networkpulse --cov-report=term-missing
      - name: Compile all modules
        run: python -m compileall -q networkpulse
