name: P0 source-only research and multi-capture stress (NOT acceptance)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/source-only-feature-audit.yml'
      - 'networkpulse/evaluation/source_only_feature_audit.py'
      - 'networkpulse/evaluation/source_only_candidates.py'
      - 'networkpulse/evaluation/source_only_capture_stress.py'
      - 'networkpulse/evaluation/source_only_readiness.py'
      - 'networkpulse/evaluation/private_r2_sources.py'
      - 'networkpulse/evaluation/live_unsw.py'
      - 'networkpulse/features.py'
      - 'networkpulse/detector.py'
      - 'tests/test_source_only_feature_audit.py'
      - 'tests/test_source_only_candidates.py'
      - 'tests/test_source_only_capture_stress.py'
      - 'tests/test_source_only_readiness.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-feature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research runtime and read-only R2 client
        run: python -m pip install -e '.[dev]' 'boto3>=1.34,<2'
      - name: Lint source-only research contract and tests
        run: python -m ruff check networkpulse/evaluation/source_only_feature_audit.py tests/test_source_only_feature_audit.py networkpulse/evaluation/source_only_candidates.py tests/test_source_only_candidates.py networkpulse/evaluation/source_only_capture_stress.py tests/test_source_only_capture_stress.py networkpulse/evaluation/source_only_readiness.py tests/test_source_only_readiness.py
      - name: Unit tests for source-only research and leakage guards
        run: python -m pytest -q tests/test_source_only_feature_audit.py tests/test_private_r2_sources.py tests/test_source_only_candidates.py tests/test_source_only_capture_stress.py tests/test_source_only_readiness.py
      - name: Fetch ONLY pinned UNSW source archive from private R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          from networkpulse.evaluation.native_cross_dataset_sources import _archives
          from networkpulse.evaluation.private_r2_sources import (
              _configured_client, stream_verified_object,
          )
          authorized_unsw = _archives()[0]
          if authorized_unsw.name != "unsw-source.zip":
              raise SystemExit("Expected authorized UNSW-only archive")
          stream_verified_object(_configured_client(), authorized_unsw)
          print("UNSW source exact bytes and SHA-256 verified from private R2")
          PY
      - name: Execute authentic source-only feature contract audit and baseline
        run: >-
          python -m networkpulse.evaluation.source_only_feature_audit
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-feature-audit.json
      - name: Execute two pre-registered source-only supervised research candidates
        run: >-
          python -m networkpulse.evaluation.source_only_candidates
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-candidates.json
      - name: Execute pre-registered within-UNSW cross-capture research stress test
        run: >-
          python -m networkpulse.evaluation.source_only_capture_stress
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-capture-stress.json
      - name: Compute auditable NO-GO operational ML readiness decision
        run: >-
          python -m networkpulse.evaluation.source_only_readiness
          --stage1 real-evidence/source-only-feature-audit.json
          --stage2 real-evidence/source-only-candidates.json
          --stress real-evidence/source-only-capture-stress.json
          --output real-evidence/source-only-readiness.json
      - name: Preserve aggregate-only source-only research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-only-feature-audit-research-only
          path: |
            real-evidence/source-only-feature-audit.json
            real-evidence/source-only-candidates.json
            real-evidence/source-only-capture-stress.json
            real-evidence/source-only-readiness.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove restricted raw source archive
        if: always()
        run: rm -f unsw-source.zip
      - name: Fail when source-only audit is unavailable
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("real-evidence/source-only-feature-audit.json")
          if not path.is_file():
              raise SystemExit("Source-only audit evidence unavailable: FAIL")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("status") != "source_only_feature_audit_completed":
              raise SystemExit("Invalid source-only audit status: FAIL")
          if report.get("operational_acceptance_demonstrated") is not False:
              raise SystemExit("Unexpected operational acceptance claim: FAIL")
          if not report.get("source_only_baseline", {}).get(
              "strict_timestamp_separation", False
          ):
              raise SystemExit("Source-only chronology not verified: FAIL")
          temporal = report.get("source_only_baseline", {})
          print(f"Chronological benchmark status: {temporal.get('status')}")
          print(f"Chronological dev class counts: {temporal.get('dev_class_counts')}")
          grouped = report.get("source_only_grouped_baseline", {})
          if grouped.get("status") != "source_only_grouped_development_measurement_not_acceptance":
              print(f"Group-disjoint benchmark BLOCKED: {grouped.get('status')}")
              raise SystemExit("No supported grouped source-only benchmark: FAIL")
          if grouped.get("host_pair_group_disjoint") is not True:
              raise SystemExit("Development groups overlap: FAIL")
          candidate_path = Path("real-evidence/source-only-candidates.json")
          if not candidate_path.is_file():
              raise SystemExit("Stage 2 source-only candidate evidence missing: FAIL")
          candidates = json.loads(candidate_path.read_text(encoding="utf-8"))
          if candidates.get("status") != "source_only_supervised_candidates_research_completed":
              raise SystemExit("Stage 2 research candidates incomplete: FAIL")
          if candidates.get("production_model_changed") is not False:
              raise SystemExit("Stage 2 production model unexpectedly changed: FAIL")
          if candidates.get("operational_ml_acceptance_demonstrated") is not False:
              raise SystemExit("Unverified operational ML acceptance claim: FAIL")
          if candidates.get("auto_selected_winner") is not False:
              raise SystemExit("Source-only candidate selected without review: FAIL")
          if len(candidates.get("candidates", [])) != 2:
              raise SystemExit("Expected exactly two pre-registered candidate results")
          stress_path = Path("real-evidence/source-only-capture-stress.json")
          if not stress_path.is_file():
              raise SystemExit("Cross-capture stress evidence missing: FAIL")
          stress = json.loads(stress_path.read_text(encoding="utf-8"))
          if stress.get("status") != "same_source_cross_capture_stress_completed":
              raise SystemExit("Cross-capture stress incomplete: FAIL")
          if stress.get("independent_site_verified") is not False:
              raise SystemExit("Unexpected independent-site certification claim: FAIL")
          if stress.get("operational_acceptance_demonstrated") is not False:
              raise SystemExit("Unexpected operational acceptance claim: FAIL")
          captures = stress.get("captures", [])
          expected = ["UNSW-NB15_2.csv", "UNSW-NB15_3.csv", "UNSW-NB15_4.csv"]
          if [c.get("member") for c in captures] != expected:
              raise SystemExit("Missing or unexpected pre-registered source captures")
          allowed = {
              "measured_same_source_cross_capture_not_acceptance",
              "blocked_insufficient_capture_class_support",
          }
          for capture in captures:
              results = capture.get("measured_from_source_capture_1_fit", {})
              if set(results) != {
                  "rf_supervised_v1", "rf_supervised_port_buckets_no_state"
              }:
                  raise SystemExit("Missing pre-registered source stress candidate")
              for value in results.values():
                  if value.get("status") not in allowed:
                      raise SystemExit("Invalid/unmeasured source stress status")
          decision_path = Path("real-evidence/source-only-readiness.json")
          if not decision_path.is_file():
              raise SystemExit("Missing evidence-based research go/no-go decision")
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          if (decision.get("decision") != "NO_GO" or
              decision.get("model_freeze_authorized") is not False or
              decision.get("production_artifact_approved") is not False or
              decision.get("operational_acceptance_demonstrated") is not False):
              raise SystemExit("Unverified production model acceptance must not proceed")
          print("Three captures measured or honestly blocked; NOT independent ML acceptance")
          print("Group-disjoint SOURCE-ONLY baseline available; NOT operational acceptance")
          PY
