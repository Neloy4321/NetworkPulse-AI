name: P0 source-only research and multi-capture stress (NOT acceptance)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/source-only-feature-audit.yml'
      - 'networkpulse/evaluation/source_only_feature_audit.py'
      - 'networkpulse/evaluation/source_only_candidates.py'
      - 'networkpulse/evaluation/source_only_capture_stress.py'
      - 'networkpulse/evaluation/source_only_readiness.py'
      - 'networkpulse/evaluation/source_only_loco.py'
      - 'networkpulse/evaluation/frozen_rf_research.py'
      - 'networkpulse/evaluation/source_training_ledger.py'
      - 'networkpulse/evaluation/iot23v2_source_adapter.py'
      - 'networkpulse/evaluation/iot23v2_exact_runtime_recheck.py'
      - 'networkpulse/evaluation/prospective_external_rf.py'
      - 'networkpulse/evaluation/private_r2_sources.py'
      - 'networkpulse/evaluation/live_unsw.py'
      - 'networkpulse/features.py'
      - 'networkpulse/detector.py'
      - 'tests/test_source_only_feature_audit.py'
      - 'tests/test_source_only_candidates.py'
      - 'tests/test_source_only_capture_stress.py'
      - 'tests/test_source_only_readiness.py'
      - 'tests/test_source_only_loco.py'
      - 'tests/test_frozen_rf_research.py'
      - 'tests/test_prospective_external_rf.py'
      - 'tests/test_iot23v2_source_adapter.py'
      - 'tests/test_iot23v2_exact_runtime_recheck.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only-feature-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research runtime and read-only R2 client
        run: python -m pip install -e '.[dev]' 'boto3>=1.34,<2'
      - name: Lint source-only research contract and tests
        run: python -m ruff check networkpulse/evaluation/source_only_feature_audit.py tests/test_source_only_feature_audit.py networkpulse/evaluation/source_only_candidates.py tests/test_source_only_candidates.py networkpulse/evaluation/source_only_capture_stress.py tests/test_source_only_capture_stress.py networkpulse/evaluation/source_only_readiness.py tests/test_source_only_readiness.py networkpulse/evaluation/source_only_loco.py tests/test_source_only_loco.py networkpulse/evaluation/frozen_rf_research.py tests/test_frozen_rf_research.py networkpulse/evaluation/prospective_external_rf.py tests/test_prospective_external_rf.py networkpulse/evaluation/source_training_ledger.py networkpulse/evaluation/iot23v2_source_adapter.py tests/test_iot23v2_source_adapter.py networkpulse/evaluation/iot23v2_exact_runtime_recheck.py tests/test_iot23v2_exact_runtime_recheck.py
      - name: Unit tests for source-only research and leakage guards
        run: python -m pytest -q tests/test_source_only_feature_audit.py tests/test_private_r2_sources.py tests/test_source_only_candidates.py tests/test_source_only_capture_stress.py tests/test_source_only_readiness.py tests/test_source_only_loco.py tests/test_frozen_rf_research.py tests/test_prospective_external_rf.py tests/test_iot23v2_source_adapter.py tests/test_iot23v2_exact_runtime_recheck.py
      - name: Fetch ONLY pinned UNSW source archive from private R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          from networkpulse.evaluation.native_cross_dataset_sources import _archives
          from networkpulse.evaluation.private_r2_sources import (
              _configured_client, stream_verified_object,
          )
          authorized_unsw = _archives()[0]
          if authorized_unsw.name != "unsw-source.zip":
              raise SystemExit("Expected authorized UNSW-only archive")
          stream_verified_object(_configured_client(), authorized_unsw)
          print("UNSW source exact bytes and SHA-256 verified from private R2")
          PY
      - name: Execute authentic source-only feature contract audit and baseline
        run: >-
          python -m networkpulse.evaluation.source_only_feature_audit
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-feature-audit.json
      - name: Execute two pre-registered source-only supervised research candidates
        run: >-
          python -m networkpulse.evaluation.source_only_candidates
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-candidates.json
      - name: Execute pre-registered within-UNSW cross-capture research stress test
        run: >-
          python -m networkpulse.evaluation.source_only_capture_stress
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-capture-stress.json
      - name: Compute auditable NO-GO operational ML readiness decision
        run: >-
          python -m networkpulse.evaluation.source_only_readiness
          --stage1 real-evidence/source-only-feature-audit.json
          --stage2 real-evidence/source-only-candidates.json
          --stress real-evidence/source-only-capture-stress.json
          --output real-evidence/source-only-readiness.json
      - name: Run pre-registered 4-fold exposed-source Leave-One-Capture-Out stress
        run: >-
          python -m networkpulse.evaluation.source_only_loco
          --unsw-zip unsw-source.zip
          --output real-evidence/source-only-loco.json
      - name: Freeze reviewed source-only RF research bundle (unsigned, NOT deployed)
        run: >-
          python -m networkpulse.evaluation.frozen_rf_research
          --unsw-zip unsw-source.zip
          --loco-report real-evidence/source-only-loco.json
          --bundle research-private/frozen-source-rf-research-only.joblib
          --manifest real-evidence/frozen-source-rf-manifest.json
          --private-ledger research-private/source-training-ledger.tsv
      - name: Verify frozen research bundle SHA and provenance without unpickling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from networkpulse.evaluation.frozen_rf_research import verify_bundle_checksum, SELECTED
          bundle = Path("research-private/frozen-source-rf-research-only.joblib")
          manifest = json.loads(Path("real-evidence/frozen-source-rf-manifest.json").read_text())
          verify_bundle_checksum(bundle, manifest["bundle_sha256"])
          assert manifest["selected_candidate"] == SELECTED
          assert manifest["training_unique"] >= 1000
          from networkpulse.generalization_evidence import load_training_keys
          ledger = load_training_keys(
              Path("research-private/source-training-ledger.tsv"),
              manifest["training_ledger_sha256"],
          )
          assert len(ledger.canonical_ids) == manifest["training_unique"]
          assert len(ledger.normalized_fingerprints) >= 1000
          print("Restricted source-flow leakage ledger verified; never uploading ledger")

          assert manifest["production_approved"] is False
          assert manifest["operator_signed"] is False
          assert manifest["independent_site_evaluated"] is False
          print("Frozen research bundle SHA verified; SIGNED DEPLOYED ML ACCEPTANCE NOT CLAIMED")
          PY
      - name: Reconstruct and independently verify private source ledger hash
        run: |
          python -m networkpulse.evaluation.source_training_ledger             --unsw-zip unsw-source.zip             --frozen-manifest real-evidence/frozen-source-rf-manifest.json             --private-output research-private/reconstructed-source-ledger.tsv
          python - <<'PY'
          from pathlib import Path
          from networkpulse.evaluation.unsw_to_toniot import digest
          a = Path("research-private/source-training-ledger.tsv")
          b = Path("research-private/reconstructed-source-ledger.tsv")
          if not a.is_file() or not b.is_file() or digest(a) != digest(b):
              raise SystemExit("Source training ledger not reproducible: FAIL")
          print("Private hashed source ledger independently reproduced; not an artifact")
          PY
      - name: Fetch SHA-pinned IoT-23v2 public flow file for exposed research corroboration
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.iot23v2_source_adapter import SOURCE_URL
          from networkpulse.evaluation.iot23v2_exact_runtime_recheck import SOURCE_SHA256, SOURCE_BYTES
          # This is a previously EXPOSED target, not a prospective pristine holdout.
          with urlopen(Request(SOURCE_URL, headers={"User-Agent": "NetworkPulse-AI-research/1.0"}), timeout=120) as response:
              if response.status != 200:
                  raise SystemExit("Official IoT-23v2 dataset URL did not return HTTP 200")
              data = response.read(SOURCE_BYTES + 1)
          if len(data) != SOURCE_BYTES or hashlib.sha256(data).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Downloaded IoT-23v2 bytes differ from user uploaded pinned original")
          Path("research-private").mkdir(parents=True, exist_ok=True)
          path = Path("research-private/iot23v2-public-source.labeled")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "wb") as out:
              out.write(data)
          print("External research dataset SHA validated; no raw external rows to be uploaded")
          PY
      - name: Recheck EXPOSED IoT-23v2 model performance in original freeze runtime
        run: >-
          python -m networkpulse.evaluation.iot23v2_exact_runtime_recheck
          --iot23v2-source research-private/iot23v2-public-source.labeled
          --frozen-bundle research-private/frozen-source-rf-research-only.joblib
          --frozen-manifest real-evidence/frozen-source-rf-manifest.json
          --private-training-ledger research-private/source-training-ledger.tsv
          --aggregate-evidence real-evidence/iot23v2-exposed-recheck.json
      - name: Preserve aggregate-only source-only research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-only-feature-audit-research-only
          path: |
            real-evidence/source-only-feature-audit.json
            real-evidence/source-only-candidates.json
            real-evidence/source-only-capture-stress.json
            real-evidence/source-only-readiness.json
            real-evidence/source-only-loco.json
            real-evidence/frozen-source-rf-manifest.json
            real-evidence/iot23v2-exposed-recheck.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve restricted research model artifact (NOT production)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-frozen-source-rf-research-only
          path: research-private/frozen-source-rf-research-only.joblib
          retention-days: 30
          if-no-files-found: error
      - name: Remove research-only model from ephemeral runner
        if: always()
        run: rm -f research-private/frozen-source-rf-research-only.joblib research-private/source-training-ledger.tsv research-private/reconstructed-source-ledger.tsv research-private/iot23v2-public-source.labeled
      - name: Remove restricted raw source archive
        if: always()
        run: rm -f unsw-source.zip
      - name: Fail when source-only audit is unavailable
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("real-evidence/source-only-feature-audit.json")
          if not path.is_file():
              raise SystemExit("Source-only audit evidence unavailable: FAIL")
          report = json.loads(path.read_text(encoding="utf-8"))
          if report.get("status") != "source_only_feature_audit_completed":
              raise SystemExit("Invalid source-only audit status: FAIL")
          if report.get("operational_acceptance_demonstrated") is not False:
              raise SystemExit("Unexpected operational acceptance claim: FAIL")
          if not report.get("source_only_baseline", {}).get(
              "strict_timestamp_separation", False
          ):
              raise SystemExit("Source-only chronology not verified: FAIL")
          temporal = report.get("source_only_baseline", {})
          print(f"Chronological benchmark status: {temporal.get('status')}")
          print(f"Chronological dev class counts: {temporal.get('dev_class_counts')}")
          grouped = report.get("source_only_grouped_baseline", {})
          if grouped.get("status") != "source_only_grouped_development_measurement_not_acceptance":
              print(f"Group-disjoint benchmark BLOCKED: {grouped.get('status')}")
              raise SystemExit("No supported grouped source-only benchmark: FAIL")
          if grouped.get("host_pair_group_disjoint") is not True:
              raise SystemExit("Development groups overlap: FAIL")
          candidate_path = Path("real-evidence/source-only-candidates.json")
          if not candidate_path.is_file():
              raise SystemExit("Stage 2 source-only candidate evidence missing: FAIL")
          candidates = json.loads(candidate_path.read_text(encoding="utf-8"))
          if candidates.get("status") != "source_only_supervised_candidates_research_completed":
              raise SystemExit("Stage 2 research candidates incomplete: FAIL")
          if candidates.get("production_model_changed") is not False:
              raise SystemExit("Stage 2 production model unexpectedly changed: FAIL")
          if candidates.get("operational_ml_acceptance_demonstrated") is not False:
              raise SystemExit("Unverified operational ML acceptance claim: FAIL")
          if candidates.get("auto_selected_winner") is not False:
              raise SystemExit("Source-only candidate selected without review: FAIL")
          if len(candidates.get("candidates", [])) != 2:
              raise SystemExit("Expected exactly two pre-registered candidate results")
          stress_path = Path("real-evidence/source-only-capture-stress.json")
          if not stress_path.is_file():
              raise SystemExit("Cross-capture stress evidence missing: FAIL")
          stress = json.loads(stress_path.read_text(encoding="utf-8"))
          if stress.get("status") != "same_source_cross_capture_stress_completed":
              raise SystemExit("Cross-capture stress incomplete: FAIL")
          if stress.get("independent_site_verified") is not False:
              raise SystemExit("Unexpected independent-site certification claim: FAIL")
          if stress.get("operational_acceptance_demonstrated") is not False:
              raise SystemExit("Unexpected operational acceptance claim: FAIL")
          captures = stress.get("captures", [])
          expected = ["UNSW-NB15_2.csv", "UNSW-NB15_3.csv", "UNSW-NB15_4.csv"]
          if [c.get("member") for c in captures] != expected:
              raise SystemExit("Missing or unexpected pre-registered source captures")
          allowed = {
              "measured_same_source_cross_capture_not_acceptance",
              "blocked_insufficient_capture_class_support",
          }
          for capture in captures:
              results = capture.get("measured_from_source_capture_1_fit", {})
              if set(results) != {
                  "rf_supervised_v1", "rf_supervised_port_buckets_no_state"
              }:
                  raise SystemExit("Missing pre-registered source stress candidate")
              for value in results.values():
                  if value.get("status") not in allowed:
                      raise SystemExit("Invalid/unmeasured source stress status")
          decision_path = Path("real-evidence/source-only-readiness.json")
          if not decision_path.is_file():
              raise SystemExit("Missing evidence-based research go/no-go decision")
          decision = json.loads(decision_path.read_text(encoding="utf-8"))
          if (decision.get("decision") != "NO_GO" or
              decision.get("model_freeze_authorized") is not False or
              decision.get("production_artifact_approved") is not False or
              decision.get("operational_acceptance_demonstrated") is not False):
              raise SystemExit("Unverified production model acceptance must not proceed")
          print("Three captures measured or honestly blocked; NOT independent ML acceptance")
          loco_path = Path("real-evidence/source-only-loco.json")
          if not loco_path.is_file():
              raise SystemExit("Source-only LOCO research results missing")
          loco = json.loads(loco_path.read_text(encoding="utf-8"))
          if loco.get("status") != "exposed_source_loco_research_completed":
              raise SystemExit("Source-only LOCO experiment incomplete")
          if loco.get("operational_acceptance_demonstrated") is not False:
              raise SystemExit("LOCO must not claim operational ML acceptance")
          if loco.get("automatic_winner_selected") is not False:
              raise SystemExit("LOCO must not select a winner automatically")
          if [fold.get("excluded_capture") for fold in loco.get("folds", [])] != [
              "UNSW-NB15_1.csv", "UNSW-NB15_2.csv", "UNSW-NB15_3.csv",
              "UNSW-NB15_4.csv"
          ]:
              raise SystemExit("LOCO did not cover four predeclared source captures")
          for fold in loco["folds"]:
              if fold.get("status") not in {
                  "measured_exposed_source_capture_development_only",
                  "blocked_insufficient_natural_class_support"
              }:
                  raise SystemExit("Unsupported LOCO evaluation status")
          frozen_path = Path("real-evidence/frozen-source-rf-manifest.json")
          if not frozen_path.is_file():
              raise SystemExit("Research RF freeze manifest unavailable: FAIL")
          frozen = json.loads(frozen_path.read_text(encoding="utf-8"))
          if frozen.get("status") != "source_only_supervised_research_bundle_frozen":
              raise SystemExit("Research model freeze did not complete")
          if frozen.get("production_approved") is not False:
              raise SystemExit("Research model was incorrectly production approved")
          if frozen.get("operator_signed") is not False:
              raise SystemExit("Research model claims nonexistent sign-off")
          exposed_file = Path("real-evidence/iot23v2-exposed-recheck.json")
          if not exposed_file.is_file():
              raise SystemExit("Exact-runtime exposed IoT-23 research result missing: FAIL")
          exposed = json.loads(exposed_file.read_text(encoding="utf-8"))
          if exposed.get("status") != "completed_exposed_laboratory_family_research_no_acceptance":
              raise SystemExit("IoT-23 source compatibility test did not complete")
          if exposed.get("production_ml_acceptance_demonstrated") is not False:
              raise SystemExit("IoT-23 lab data must not authorize production acceptance")
          if exposed.get("model_untouched_from_prior_unsw_freeze") is not True:
              raise SystemExit("Detected forbidden model freeze mutation after target labels")
          if exposed.get("training_flow_overlap") != 0:
              raise SystemExit("Exposed IoT-23 and UNSW training flows overlap")
          print("Research-only model freeze complete; INDEPENDENT SITE NOT VALIDATED")
          print("Group-disjoint SOURCE-ONLY baseline available; NOT operational acceptance")
          PY
