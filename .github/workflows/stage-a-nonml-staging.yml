name: Stage A non-ML staging security and real dependency CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'networkpulse/infra_staging.py'
      - 'tests/test_infra_staging.py'
      - 'deploy/Dockerfile.infra-staging'
      - 'deploy/compose.infra-staging.yml'
      - 'deploy/compose.infra-staging.ci.yml'
      - 'infra/Caddyfile.infra-staging'
      - 'infra/prometheus/staging-infra.yaml'
      - '.github/workflows/stage-a-nonml-staging.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'networkpulse/infra_staging.py'
      - 'tests/test_infra_staging.py'
      - 'deploy/Dockerfile.infra-staging'
      - 'deploy/compose.infra-staging.yml'
      - 'deploy/compose.infra-staging.ci.yml'
      - 'infra/Caddyfile.infra-staging'
      - 'infra/prometheus/staging-infra.yaml'
      - '.github/workflows/stage-a-nonml-staging.yml'

permissions:
  contents: read

jobs:
  infrastructure-only:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test, native PostgreSQL, Redis and OIDC dependencies
        run: python -m pip install -e '.[dev,postgres,streaming]'
      - name: Lint isolated staging contract
        run: python -m ruff check networkpulse/infra_staging.py tests/test_infra_staging.py
      - name: Verify denied ML APIs, readiness failures and RBAC without real tokens
        run: python -m pytest -q tests/test_infra_staging.py

      - name: Refuse Compose without operator-provisioned staging variables
        run: |
          if env -u NETWORKPULSE_STAGING_DB_PASSWORD \
                 -u NETWORKPULSE_STAGING_REDIS_PASSWORD \
                 -u NETWORKPULSE_STAGING_OIDC_ISSUER \
                 -u NETWORKPULSE_STAGING_OIDC_JWKS_URL \
                 -u NETWORKPULSE_STAGING_OIDC_AUDIENCE \
                 -u NETWORKPULSE_STAGING_DOMAIN \
                 docker compose -f deploy/compose.infra-staging.yml config --quiet >/dev/null 2>&1; then
            echo "FAIL: staging unexpectedly accepts no separate identity/secrets" >&2
            exit 1
          fi
          echo "PASS: no secrets or OIDC / DNS configuration means no deployment"

      - name: Generate isolated CI-only credentials and explicitly NON-real OIDC parameters
        run: |
          {
            echo "NETWORKPULSE_STAGING_DB_PASSWORD=$(openssl rand -hex 24)"
            echo "NETWORKPULSE_STAGING_REDIS_PASSWORD=$(openssl rand -hex 24)"
            echo "NETWORKPULSE_STAGING_OIDC_ISSUER=https://ci-invalid.example.test/issuer"
            echo "NETWORKPULSE_STAGING_OIDC_JWKS_URL=https://ci-invalid.example.test/jwks"
            echo "NETWORKPULSE_STAGING_OIDC_AUDIENCE=networkpulse-ci-not-production"
            echo "NETWORKPULSE_STAGING_DOMAIN=ci-invalid.example.test"
          } >> "$GITHUB_ENV"
          echo "CI tests deliberately do NOT mint or verify actual operator IdP tokens"

      - name: Verify offline public TLS Caddy syntax, never request a certificate
        run: |
          docker run --rm \
            -e NETWORKPULSE_STAGING_DOMAIN="$NETWORKPULSE_STAGING_DOMAIN" \
            -v "$PWD/infra/Caddyfile.infra-staging:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.7 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Validate private Prometheus scrape configuration
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/infra/prometheus/staging-infra.yaml:/etc/prometheus/prometheus.yaml:ro" \
            prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yaml

      - name: Validate isolated Compose and build rootless non-ML image
        run: |
          docker compose -f deploy/compose.infra-staging.yml config --quiet
          docker compose -f deploy/compose.infra-staging.yml \
            -f deploy/compose.infra-staging.ci.yml \
            config --quiet
          docker compose -f deploy/compose.infra-staging.yml \
            -f deploy/compose.infra-staging.ci.yml \
            build api

      - name: Start real PostgreSQL + Redis with the model-free staging API
        run: |
          docker compose -f deploy/compose.infra-staging.yml \
            -f deploy/compose.infra-staging.ci.yml \
            up -d --no-build db redis api
          for i in $(seq 1 35); do
            if curl --silent --show-error --fail http://127.0.0.1:18120/health/ready \
              >/tmp/stage-a-ci-readiness.json 2>/dev/null; then
              echo "Real CI PostgreSQL, password-protected Redis and staging API are healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose -f deploy/compose.infra-staging.yml \
            -f deploy/compose.infra-staging.ci.yml ps
          exit 1

      - name: Prove readiness, role-denial, ML nonexistence and private metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import httpx
          base = "http://127.0.0.1:18120"
          with httpx.Client(timeout=4) as client:
              result = client.get(base + "/health/ready")
              assert result.status_code == 200
              health = result.json()
              assert health["mode"] == "non_ml_infrastructure_only"
              assert health["model_loaded"] is False
              assert health["ml_acceptance_claimed"] is False
              assert health["dependencies"] == {"postgres": "ready", "redis": "ready"}
              for route in ("viewer", "analyst", "admin"):
                  assert client.get(base + "/api/staging/" + route).status_code == 401
              assert client.post(base + "/api/v1/ingest", json={}).status_code == 404
              assert client.post(base + "/api/v2/score", json={}).status_code == 404
              assert client.get(base + "/openapi.json").status_code == 404
              metrics = client.get(base + "/internal/metrics")
              assert metrics.status_code == 200
              assert 'dependency="postgres"} 1.0' in metrics.text
              assert 'dependency="redis"} 1.0' in metrics.text
          print("Real CI-only dependency integration PASS; real external HTTPS/OIDC pending")
          PY

      - name: Remove ephemeral staging volumes and CI-only credentials
        if: always()
        run: |
          docker compose -f deploy/compose.infra-staging.yml \
            -f deploy/compose.infra-staging.ci.yml \
            down --volumes --remove-orphans || true
          rm -f /tmp/stage-a-ci-readiness.json
