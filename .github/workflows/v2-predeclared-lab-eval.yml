name: V2 fixed RF cross-capture IoT lab test (NOT independent-site acceptance)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/v2-predeclared-lab-eval.yml'
      - 'networkpulse/evaluation/v2_predeclared_lab_eval.py'
      - 'tests/test_v2_predeclared_lab_eval.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-family-capture-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install research runtime
        run: python -m pip install -e '.[dev]' 'boto3>=1.34,<2'
      - name: Lint frozen model test without target-dependent tuning
        run: >-
          python -m ruff check
          networkpulse/evaluation/v2_predeclared_lab_eval.py
          tests/test_v2_predeclared_lab_eval.py
      - name: Test immutable preregistration and class-support blockers
        run: >-
          python -m pytest -q
          tests/test_v2_predeclared_lab_eval.py
      - name: Verify pinned UNSW source from R2 (TRAIN ONLY)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          from networkpulse.evaluation.native_cross_dataset_sources import _archives
          from networkpulse.evaluation.private_r2_sources import (
              _configured_client, stream_verified_object,
          )
          source = _archives()[0]
          if source.name != "unsw-source.zip":
              raise SystemExit("Only approved UNSW source authorized")
          stream_verified_object(_configured_client(), source)
          print("UNSW source verified by original size and SHA-256")
          PY
      - name: Obtain previously exposed IoT-23 capture 34-1 for TRAIN ONLY
        run: |
          python - <<'PY'
          import hashlib
          import os
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.iot23v2_source_adapter import SOURCE_URL
          from networkpulse.evaluation.iot23v2_exact_runtime_recheck import (
              SOURCE_BYTES, SOURCE_SHA256,
          )
          with urlopen(Request(SOURCE_URL, headers={
              "User-Agent": "NetworkPulse-AI-research/1.0"
          }), timeout=120) as response:
              data = response.read(SOURCE_BYTES + 1)
          if len(data) != SOURCE_BYTES or hashlib.sha256(data).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Exposed source 34-1 changed from frozen research input")
          fd = os.open("iot34-train-only.labeled", os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, "wb") as out:
              out.write(data)
          PY
      - name: Rebuild already frozen V2 RF; require matching artifact SHA
        run: |
          python -m networkpulse.evaluation.v2_mixed_source_freeze             --unsw-zip unsw-source.zip             --iot23v2-labeled iot34-train-only.labeled             --unsigned-model private-model/research-v2-model.joblib             --manifest aggregate-evidence/research-v2-freeze-manifest.json
          python - <<'PY'
          from pathlib import Path
          from networkpulse.evaluation.unsw_to_toniot import digest
          from networkpulse.evaluation.v2_predeclared_lab_eval import FROZEN_SOURCE_V2_SHA
          if digest(Path("private-model/research-v2-model.joblib")) != FROZEN_SOURCE_V2_SHA:
              raise SystemExit("Research model drifted after preregistration; do not score holdouts")
          print("Original source-trained V2 RF bit-for-bit verified BEFORE target scoring")
          PY
      - name: Acquire two predeclared SMALL official IoT lab targets
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.v2_predeclared_lab_eval import CAPTURES
          root = "https://mcfp.felk.cvut.cz/publicDatasets/IoT-23-Dataset-v2/"
          for name, filename in CAPTURES.items():
              url = root + name + "/" + filename
              with urlopen(Request(url, headers={
                  "User-Agent": "NetworkPulse-AI-research/1.0"
              }), timeout=120) as response:
                  if response.status != 200:
                      raise SystemExit("Official registered Zeek target not accessible")
                  data = response.read(10_000_001)
              if not 0 < len(data) <= 10_000_000:
                  raise SystemExit("Unexpected target byte limit")
              target = Path(filename)
              fd = os.open(target, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
              with os.fdopen(fd, "wb") as output:
                  output.write(data)
              print(name, "source-locked-before-label-evaluation", hashlib.sha256(data).hexdigest())
          PY
      - name: One-shot score BOTH declared targets without retraining
        run: >-
          python -m networkpulse.evaluation.v2_predeclared_lab_eval
          --frozen-bundle private-model/research-v2-model.joblib
          --manifest aggregate-evidence/research-v2-freeze-manifest.json
          --capture-8 2018-07-31-15-15-09-192.168.100.113-zeek-conn-log.labeled
          --capture-20 2018-10-02-13-12-30-192.168.100.103-zeek-conn-log.labeled
          --aggregate-output aggregate-evidence/v2-two-preregistered-lab-results.json
      - name: Do NOT falsely promote a lab research score to production
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("aggregate-evidence/v2-two-preregistered-lab-results.json").read_text())
          if result.get("p0_operational_ml_acceptance") != "NO_GO":
              raise SystemExit("Unverified real-world ML acceptance claim")
          if result.get("production_model_signed_and_active") is not False:
              raise SystemExit("Research bundle cannot be the signed live detector")
          if [x["capture"] for x in result["capture_results"]] != [
              "CTU-IoT-Malware-Capture-8-1", "CTU-IoT-Malware-Capture-20-1"
          ]:
              raise SystemExit("Target set was changed after preregistration")
          if result.get("training_or_threshold_adjusted_after_new_target") is not False:
              raise SystemExit("Model was tuned to already-opened target labels")
          print("Predeclared test complete with truthful failure/blockers")
          PY
      - name: Publish aggregate non-identifying test evidence ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-two-laboratory-capture-generalization-research-only
          path: |
            aggregate-evidence/research-v2-freeze-manifest.json
            aggregate-evidence/v2-two-preregistered-lab-results.json
          retention-days: 14
          if-no-files-found: warn
      - name: Delete all raw source/target flows and model bytes from runner
        if: always()
        run: |
          rm -f unsw-source.zip iot34-train-only.labeled
          rm -f 2018-07-31-15-15-09-192.168.100.113-zeek-conn-log.labeled
          rm -f 2018-10-02-13-12-30-192.168.100.103-zeek-conn-log.labeled
          rm -f private-model/research-v2-model.joblib

# Research lab captures from the same collection CANNOT PASS operational P0.
