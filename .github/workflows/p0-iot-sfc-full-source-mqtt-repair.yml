name: P0 IoT-SFC whole-source date-balanced MQTT candidate

on:
  pull_request:
    branches: [main, feature/p0-mqtt-recall-repair-20261023]
    paths:
      - 'networkpulse/evaluation/iot_sfc_full_day_mqtt_fit.py'
      - 'networkpulse/evaluation/iot_sfc_mqtt_repair.py'
      - 'networkpulse/evaluation/iot_sfc_combined_uwf_external.py'
      - 'tests/test_iot_sfc_full_day_mqtt_fit.py'
      - 'tests/test_iot_sfc_combined_uwf_external.py'
      - '.github/workflows/p0-iot-sfc-full-source-mqtt-repair.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-day-family-balanced-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test and model runtime
        run: python -m pip install -e '.[dev]'
      - name: Lint and verify source-only deterministic sampling tests
        run: |
          python -m ruff check networkpulse/evaluation/iot_sfc_full_day_mqtt_fit.py networkpulse/evaluation/iot_sfc_mqtt_repair.py networkpulse/evaluation/iot_sfc_combined_uwf_external.py tests/test_iot_sfc_full_day_mqtt_fit.py tests/test_iot_sfc_mqtt_repair.py tests/test_iot_sfc_combined_uwf_external.py
          python -m pytest -q tests/test_iot_sfc_full_day_mqtt_fit.py tests/test_iot_sfc_mqtt_repair.py tests/test_iot_sfc_combined_uwf_external.py
      - name: Restore SHA-verified historical frozen research model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p private-model aggregate
          gh run download 39921326610 --repo Neloy4321/NetworkPulse-AI \
            --name iotsfc-v7-timefenced-unsigned-RESEARCH-model \
            --dir private-model
          test "$(sha256sum private-model/unsigned-research-day-fenced.joblib | cut -d' ' -f1)" = \
            ecc320bc693481fc45b143b48ffbebcb117899e888e4687930f3361501af6fa1
      - name: Acquire exact original authorized source ZIP
        run: |
          set -euo pipefail
          mkdir -p private-archive
          curl -fLSs --retry 2 --retry-delay 7 --connect-timeout 30 \
            --max-time 1400 \
            -o private-archive/iot_dataset_v7.zip \
            'https://zenodo.org/records/23371775/files/iot_dataset_v7.zip?download=1'
          test "$(stat -c %s private-archive/iot_dataset_v7.zip)" = 776500807
          test "$(sha256sum private-archive/iot_dataset_v7.zip | cut -d' ' -f1)" = \
            070b1356e5bd296e584109fae79139cfe0f20ff4790f69e42994d67362cb9f62
      - name: Acquire exact CC BY UWF Zeek external subset without using labels for fit
        run: |
          set -euo pipefail
          mkdir -p private-external
          curl -fLSs --retry 2 --retry-delay 5 --max-time 180 \
            -o private-external/uwf-zeek22-discovery.csv \
            'https://datasets.uwf.edu/data/UWF-ZeekData22/csv/part-00000-15e3dd03-ea76-429e-a52a-ce96a90517f9-c000.csv'
          test "$(stat -c %s private-external/uwf-zeek22-discovery.csv)" = 2057705
          test "$(sha256sum private-external/uwf-zeek22-discovery.csv | cut -d' ' -f1)" = \
            991d7cd72f299484ab2892df21a02cd838fea0dce3e92eab6a406c69f78e79c2
      - name: Sample across full 42M-row source, fit and stress without new holdout claims
        run: |
          OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=2 \
          python -m networkpulse.evaluation.iot_sfc_full_day_mqtt_fit \
            --archive private-archive/iot_dataset_v7.zip \
            --original-model private-model/unsigned-research-day-fenced.joblib \
            --uwf-external-csv private-external/uwf-zeek22-discovery.csv \
            --report aggregate/iotsfc-whole-source-mqtt-research.json
      - name: Assert old immutable failure and no false qualification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('aggregate/iotsfc-whole-source-mqtt-research.json').read_text())
          assert r['exposed_stress']['original_locked_comparison'] == {
              'tn': 155221, 'fp': 119, 'fn': 432, 'tp': 590
          }
          assert r['source_ledger']['late_test_labels_inspected_during_source_fit'] is False
          assert r['new_prospective_holdout_used'] is False
          fused = r['exposed_stress']['frozen_or_repair_research_only']
          assert fused['selection_is_independently_qualified'] is False
          assert fused['already_exposed_same_lab_labels'] is True
          assert fused['combined']['confusion']['fn'] <= 432
          external = r['external_uwf_transfer_stress']
          assert external['frozen']['confusion'] == {
              'tn': 8376, 'fp': 15, 'fn': 1714, 'tp': 372
          }
          assert external['external_test_used_for_fit_or_cutoff_choice'] is False
          assert external['prospective_independent_field_site'] is False
          assert external['dates_with_benign_and_attack'] == 0
          assert external['model_exported_or_deployed'] is False
          assert external['operational_ml_p0'] == 'NO_GO'
          assert r['independently_reviewed_flow_labels'] is False
          assert r['signed_or_deployed'] is False
          assert r['operational_ml_p0'] == 'NO_GO'
          print('Whole-source balanced MQTT research evidence, not field acceptance')
          PY
      - name: Delete raw network ZIP and executable historical model
        if: always()
        run: |
          rm -f private-archive/iot_dataset_v7.zip
          rm -f private-external/uwf-zeek22-discovery.csv
          rm -f private-model/unsigned-research-day-fenced.joblib
      - name: Upload aggregate-only group-separated source and stress evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-whole-source-date-family-mqtt-aggregate-only
          path: aggregate/iotsfc-whole-source-mqtt-research.json
          if-no-files-found: ignore
          retention-days: 14
