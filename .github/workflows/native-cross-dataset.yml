name: Native UNSW to TON independent dataset ML evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-cross-dataset.yml'
      - 'networkpulse/evaluation/unsw_to_toniot.py'
      - 'networkpulse/evaluation/domain_shift_diagnostics.py'
      - 'networkpulse/evaluation/archive_members.py'
      - 'networkpulse/evaluation/live_unsw.py'
      - 'tests/test_archive_members.py'
      - 'tests/test_unsw_to_toniot.py'
      - 'tests/test_domain_shift_diagnostics.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-cross-dataset.yml'
      - 'networkpulse/evaluation/unsw_to_toniot.py'
      - 'networkpulse/evaluation/domain_shift_diagnostics.py'
      - 'networkpulse/evaluation/archive_members.py'
      - 'networkpulse/evaluation/live_unsw.py'
      - 'tests/test_archive_members.py'
      - 'tests/test_unsw_to_toniot.py'
      - 'tests/test_domain_shift_diagnostics.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cross-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native runtime and authorized downloader
        run: python -m pip install -e '.[dev]' 'gdown>=5.2,<6'
      - name: Unit-test security and native adapter
        run: python -m pytest -q tests/test_unsw_to_toniot.py tests/test_archive_members.py tests/test_domain_shift_diagnostics.py
      - name: Download two authorized real source archives
        id: fetch-sources
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import gdown
          from pathlib import Path
          records = (
              ("unsw-source.zip", "16eIgENKYpiLwJNHZWRrYdPfGj6AOOtkT", 586382286),
              ("ton-source.zip", "1rkNwQzrkpcnmtM8G5a-O7dAtr-y_9wFy", 3372478580),
          )
          quota_markers = ("too many users", "quota", "rate limit")
          unavailable = []
          for file, fileid, size in records:
              path = Path(file)
              last_error = None
              for attempt in range(1, 4):
                  try:
                      ok = gdown.download(id=fileid, output=str(path), quiet=True, fuzzy=True, resume=True)
                      if ok and path.exists():
                          if path.stat().st_size != size:
                              raise RuntimeError("Source size mismatch; no evaluation claim")
                          break
                      last_error = RuntimeError("Authorized source ZIP unavailable; no claim")
                  except Exception as exc:
                      last_error = exc
                  message = str(last_error).lower()
                  if not any(marker in message for marker in quota_markers):
                      raise last_error
                  if path.exists():
                      path.unlink()
                  if attempt < 3:
                      time.sleep(20)
              else:
                  unavailable.append({"file": file, "error": str(last_error)})

          if unavailable:
              Path("real-evidence").mkdir(parents=True, exist_ok=True)
              Path("real-evidence/native-unsw-to-ton.json").write_text(
                  json.dumps(
                      {
                          "status": "skipped",
                          "reason": "authorized dataset temporarily unavailable from Google Drive",
                          "unavailable_sources": unavailable,
                      },
                      indent=2,
                  )
                  + "\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("ready=false\n")
          else:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("ready=true\n")
          PY
      - name: Freeze source-only trained native Detector and evaluate TON holdout
        if: steps.fetch-sources.outputs.ready == 'true'
        run: |
          python -m networkpulse.evaluation.unsw_to_toniot \
            --unsw-zip unsw-source.zip --ton-zip ton-source.zip \
            --output real-evidence/native-unsw-to-ton.json
      - name: Preserve aggregate-only report even when operational gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-independent-dataset-native-evidence
          path: real-evidence/native-unsw-to-ton.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove raw network archives
        if: always()
        run: rm -f unsw-source.zip ton-source.zip
