name: Native UNSW to TON independent dataset ML evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/native-cross-dataset.yml'
      - 'networkpulse/evaluation/unsw_to_toniot.py'
      - 'networkpulse/evaluation/domain_shift_diagnostics.py'
      - 'networkpulse/evaluation/archive_members.py'
      - 'networkpulse/evaluation/live_unsw.py'
      - 'networkpulse/evaluation/native_cross_dataset_sources.py'
      - 'tests/test_archive_members.py'
      - 'tests/test_unsw_to_toniot.py'
      - 'tests/test_domain_shift_diagnostics.py'
      - 'tests/test_native_cross_dataset_sources.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/native-cross-dataset.yml'
      - 'networkpulse/evaluation/unsw_to_toniot.py'
      - 'networkpulse/evaluation/domain_shift_diagnostics.py'
      - 'networkpulse/evaluation/archive_members.py'
      - 'networkpulse/evaluation/live_unsw.py'
      - 'networkpulse/evaluation/native_cross_dataset_sources.py'
      - 'tests/test_archive_members.py'
      - 'tests/test_unsw_to_toniot.py'
      - 'tests/test_domain_shift_diagnostics.py'
      - 'tests/test_native_cross_dataset_sources.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cross-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install native runtime and authorized downloader
        run: python -m pip install -e '.[dev]' 'gdown>=5.2,<6'
      - name: Unit-test security and native adapter
        run: python -m pytest -q tests/test_unsw_to_toniot.py tests/test_archive_members.py tests/test_domain_shift_diagnostics.py tests/test_native_cross_dataset_sources.py
      - name: Download two authorized real source archives
        id: fetch-sources
        run: >
          python -m networkpulse.evaluation.native_cross_dataset_sources
          --status-report real-evidence/native-unsw-to-ton.json
          --github-output "$GITHUB_OUTPUT"
      - name: Freeze source-only trained native Detector and evaluate TON holdout
        if: steps.fetch-sources.outputs.ready == 'true'
        run: |
          python -m networkpulse.evaluation.unsw_to_toniot \
            --unsw-zip unsw-source.zip --ton-zip ton-source.zip \
            --output real-evidence/native-unsw-to-ton.json
      - name: Preserve aggregate-only report even when operational gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-independent-dataset-native-evidence
          path: real-evidence/native-unsw-to-ton.json
          retention-days: 14
          if-no-files-found: warn
      - name: Remove raw network archives
        if: always()
        run: rm -f unsw-source.zip ton-source.zip
      - name: Fail when authorized source archives are unavailable
        if: always() && steps.fetch-sources.outputs.ready != 'true'
        run: |
          echo "Required source archives unavailable or failed integrity verification."
          echo "Evaluation step did not run; failing required check."
          exit 1
