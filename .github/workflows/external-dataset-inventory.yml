name: Inspect external datasets (manual, metadata only)
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "Public, authorized Google Drive ZIP file ID"
        required: true
        type: string
      expected_bytes:
        description: "Expected exact ZIP size in bytes"
        required: true
        type: string
      label:
        description: "Non-sensitive report label (letters and hyphens)"
        required: true
        default: manual-archive
        type: string
permissions:
  contents: read
jobs:
  archive-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google Drive downloader
        run: python -m pip install 'gdown>=5.2,<6'
      - name: Inspect ZIP metadata without extracting raw files
        env:
          GOOGLE_DRIVE_ARCHIVE_ID: ${{ inputs.file_id }}
          EXPECTED_ARCHIVE_BYTES: ${{ inputs.expected_bytes }}
          ARCHIVE_LABEL: ${{ inputs.label }}
        run: |
          python tools/audit_external_dataset_zip.py \
            --id "$GOOGLE_DRIVE_ARCHIVE_ID" \
            --label "$ARCHIVE_LABEL" \
            --expected-bytes "$EXPECTED_ARCHIVE_BYTES" \
            --report-dir archive-audit-reports
      - name: Preserve small metadata-only report, never raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dataset-manifest
          path: archive-audit-reports/*.json
          retention-days: 3
          if-no-files-found: warn
