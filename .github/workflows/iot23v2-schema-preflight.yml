name: IoT-23v2 labeled Zeek schema preflight (synthetic fixtures only)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/iot23v2-schema-preflight.yml'
      - 'networkpulse/evaluation/iot23v2_source_adapter.py'
      - 'tests/test_iot23v2_source_adapter.py'
      - 'networkpulse/schemas.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-public-dataset-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test package without accessing private source archives
        run: python -m pip install -e '.[dev]'
      - name: Lint IoT-23v2 schema adapter
        run: python -m ruff check networkpulse/evaluation/iot23v2_source_adapter.py tests/test_iot23v2_source_adapter.py
      - name: Validate IoT-23v2 schema with synthetic samples ONLY
        run: python -m pytest -q tests/test_iot23v2_source_adapter.py

# No private R2 keys, operator credentials, network captures or model bytes.
# This workflow must NOT produce an operational ML acceptance claim.
