name: Isolated Redis and PostgreSQL crash recovery drill
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-single-node-crash-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETWORKPULSE_ALLOW_ISOLATED_DOCKER_DRILL: I_ACCEPT_EPHEMERAL_CONTAINERS
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install actual native model, PostgreSQL and Redis runtimes
        run: python -m pip install -e '.[postgres,streaming]'
      - name: Download approved disposable test-service images
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine
      - name: Actually SIGKILL and restart isolated PostgreSQL and Redis
        run: >
          python -m networkpulse.container_failover
          --confirm-disposable-lab
          --report "${{ runner.temp }}/networkpulse-disposable-crash-drill.json"
      - name: Store metadata-only single-node crash recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-single-node-crash-drill-${{ github.run_id }}
          path: ${{ runner.temp }}/networkpulse-disposable-crash-drill.json
          retention-days: 14
          if-no-files-found: warn
