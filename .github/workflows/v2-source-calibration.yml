name: V2 source-only group-calibrated recall repair (NO P0 approval)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/v2-source-calibration.yml'
      - 'networkpulse/evaluation/v2_source_calibration.py'
      - 'tests/test_v2_source_calibration.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-internal-recall-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install reproducible research packages
        run: python -m pip install -e '.[dev]' 'boto3>=1.34,<2'
      - name: Lint predeclared source calibration
        run: >-
          python -m ruff check networkpulse/evaluation/v2_source_calibration.py
          tests/test_v2_source_calibration.py
      - name: Test source group and mathematical gate behavior
        run: python -m pytest -q tests/test_v2_source_calibration.py
      - name: Acquire approved UNSW DEVELOPMENT source bytes (not a new holdout)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          from networkpulse.evaluation.native_cross_dataset_sources import _archives
          from networkpulse.evaluation.private_r2_sources import (
              _configured_client, stream_verified_object,
          )
          archive = _archives()[0]
          if archive.name != "unsw-source.zip":
              raise SystemExit("Unexpected original source identity")
          stream_verified_object(_configured_client(), archive)
          print("Full UNSW source SHA pinned; source DEV only")
          PY
      - name: Fetch only previously exposed IoT 34-1 DEVELOPMENT capture
        run: |
          python - <<'PY'
          import hashlib
          import os
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.iot23v2_source_adapter import SOURCE_URL
          from networkpulse.evaluation.iot23v2_exact_runtime_recheck import (
              SOURCE_BYTES, SOURCE_SHA256,
          )
          with urlopen(Request(SOURCE_URL, headers={
              "User-Agent": "NetworkPulse-AI-research/1.0"
          }), timeout=120) as response:
              content = response.read(SOURCE_BYTES + 1)
          if len(content) != SOURCE_BYTES or hashlib.sha256(content).hexdigest() != SOURCE_SHA256:
              raise SystemExit("Previously exposed source SHA changed")
          fd = os.open("private-iot34-development.labeled", os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,"wb") as target:
              target.write(content)
          print("Source calibration contains NO Hakai/Torii/TON evaluation labels")
          PY
      - name: Fit source-only candidate and calibrate with strict FPR margin
        run: >-
          python -m networkpulse.evaluation.v2_source_calibration
          --unsw-zip unsw-source.zip
          --iot23-source private-iot34-development.labeled
          --research-model private-calibration/research-only-v2-calibrated.joblib
          --report aggregate-calibration/v2-source-calibration.json
      - name: Fail closed on false operational acceptance claims
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("aggregate-calibration/v2-source-calibration.json").read_text())
          if (r.get("operational_ml_acceptance") != "NO_GO"
              or r.get("independent_operator_site_verified") is not False
              or r.get("production_model_signed_and_deployed") is not False
              or r.get("selected",{}).get("untouched_holdout_scored") is not False):
              raise SystemExit("Exposed source calibration cannot be a production approval")
          choice = r["selected"]
          if choice["cutoff"] is not None:
              if choice["source_cal_confusion"]["source_cal_fpr_upper95"] > 0.025:
                  raise SystemExit("Attempt to weaken predeclared source safety budget")
              print("Research-only source-calibrated cutoff:", choice["cutoff"],
                    "source recall lower goal:", choice["source_cal_recall_lower_goal_met"])
          else:
              print("No cutoff met source FPR budget, remain NO_GO")
          PY
      - name: Preserve source-only aggregate calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-source-calibration-research-only
          path: aggregate-calibration/v2-source-calibration.json
          retention-days: 30
          if-no-files-found: warn
      - name: Preserve unsigned research-only calibrated model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v2-unsigned-source-calibrated-candidate
          path: private-calibration/research-only-v2-calibrated.joblib
          retention-days: 14
          if-no-files-found: warn
      - name: Purge sensitive raw flow input and candidate from runner
        if: always()
        run: |
          rm -f unsw-source.zip private-iot34-development.labeled
          rm -f private-calibration/research-only-v2-calibrated.joblib

# Intentionally no untouched target scoring or active production deployment.
