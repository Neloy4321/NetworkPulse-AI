name: P0 IoT-SFC real frozen model descriptive FPR and Recall

on:
  pull_request:
    branches: [main]
    paths:
      - 'networkpulse/evaluation/iot_sfc_frozen_score.py'
      - 'tests/test_iot_sfc_frozen_score.py'
      - '.github/workflows/p0-iot-sfc-frozen-score.yml'
  push:
    branches: [main]
    paths:
      - 'networkpulse/evaluation/iot_sfc_frozen_score.py'
      - 'tests/test_iot_sfc_frozen_score.py'
      - '.github/workflows/p0-iot-sfc-frozen-score.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pinned-source-frozen-model:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned project runtime and tests
        run: python -m pip install -e '.[dev]'
      - name: Unit tests before any sensitive source retrieval
        run: |
          python -m ruff check networkpulse/evaluation/iot_sfc_frozen_score.py tests/test_iot_sfc_frozen_score.py
          python -m pytest -q tests/test_iot_sfc_frozen_score.py
      - name: Retrieve trusted, original GitHub-generated frozen model and calibration manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p private-model private-manifest aggregate-only
          gh run download 38909855312 --repo Neloy4321/NetworkPulse-AI \
            --name v2-unsigned-source-calibrated-candidate \
            --dir private-model
          gh run download 38909855312 --repo Neloy4321/NetworkPulse-AI \
            --name v2-source-calibration-research-only \
            --dir private-manifest
          test -f private-model/research-only-v2-calibrated.joblib
          test -f private-manifest/v2-source-calibration.json
          test "$(sha256sum private-model/research-only-v2-calibrated.joblib | cut -d ' ' -f1)" = \
            "cd239783fd4318c0c4e897f1d451c2d5af4b42132979c79a4e489df626f538a5"
      - name: Fetch original preregistered IoT-SFC v7 from official Zenodo
        env:
          SOURCE_URL: https://zenodo.org/records/23371775/files/iot_dataset_v7.zip?download=1
        run: |
          set -euo pipefail
          mkdir -p private-source
          curl -fLSs --retry 2 --retry-delay 7 --connect-timeout 30 \
            --max-time 1700 --output private-source/iot_dataset_v7.zip "$SOURCE_URL"
          test "$(stat -c '%s' private-source/iot_dataset_v7.zip)" = 776500807
          test "$(sha256sum private-source/iot_dataset_v7.zip | cut -d ' ' -f1)" = \
            "070b1356e5bd296e584109fae79139cfe0f20ff4790f69e42994d67362cb9f62"
      - name: REAL model prediction on first 200000 source CSV rows, fixed 0.20, no tuning
        run: |
          python -m networkpulse.evaluation.iot_sfc_frozen_score \
            --archive private-source/iot_dataset_v7.zip \
            --model private-model/research-only-v2-calibrated.joblib \
            --manifest private-manifest/v2-source-calibration.json \
            --max-rows 200000 \
            --report aggregate-only/iot-sfc-v7-frozen-200k-observation.json
      - name: Verify not misrepresented as full P0 acceptance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          j=json.loads(Path("aggregate-only/iot-sfc-v7-frozen-200k-observation.json").read_text())
          assert j["frozen_model_sha256"] == "cd239783fd4318c0c4e897f1d451c2d5af4b42132979c79a4e489df626f538a5"
          assert j["threshold"] == .20
          assert j["rows_seen"] == 200000
          assert j["research_quality_acceptance"] == "NOT_ESTABLISHED"
          assert j["p0_operational_ml_acceptance"] == "NO_GO"
          assert j["trained_or_tuned_on_target"] is False
          assert j["source_labels_independently_verified"] is False
          print("Real descriptive FPR/Recall only, no false field acceptance")
          PY
      - name: Securely delete target and executable joblib even if run fails
        if: always()
        run: |
          rm -f private-source/iot_dataset_v7.zip
          rm -f private-model/research-only-v2-calibrated.joblib
          rm -f private-manifest/v2-source-calibration.json
      - name: Retain only aggregate metrics, no private raw flows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-iotsfc-v7-real-frozen-rf-200k-descriptive-no-raw
          path: aggregate-only/iot-sfc-v7-frozen-200k-observation.json
          if-no-files-found: ignore
          retention-days: 14
