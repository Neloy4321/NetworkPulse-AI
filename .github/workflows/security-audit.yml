name: Dependency vulnerability audit
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked-in workflow tools and app dependencies
        run: |
          python -m pip install 'pip-audit>=2.7,<3'
          python -m pip install -e '.[postgres,streaming]'
      - name: Audit installed dependencies
        run: pip-audit --local --progress-spinner off
