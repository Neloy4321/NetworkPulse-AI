name: V2 mixed exposed-source RF research freeze (NO production acceptance)

on:
  pull_request:
    branches: ['copilot/fix-native-cross-dataset-job']
    paths:
      - '.github/workflows/v2-mixed-source-freeze.yml'
      - 'networkpulse/feature_contract_v2.py'
      - 'networkpulse/evaluation/v2_mixed_source_freeze.py'
      - 'networkpulse/evaluation/iot23v2_contract_v2_audit.py'
      - 'tests/test_v2_mixed_source_freeze.py'
      - 'tests/test_feature_contract_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-exposed-source-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned project research dependencies
        run: python -m pip install -e '.[dev]' 'boto3>=1.34,<2'
      - name: Lint V2 fit and immutable-source tests
        run: >-
          python -m ruff check
          networkpulse/feature_contract_v2.py
          networkpulse/evaluation/v2_mixed_source_freeze.py
          tests/test_v2_mixed_source_freeze.py
          tests/test_feature_contract_v2.py
      - name: Verify V2 research-only training gates in unit tests
        run: >-
          python -m pytest -q
          tests/test_feature_contract_v2.py
          tests/test_v2_mixed_source_freeze.py
      - name: Download ONLY approved UNSW source ZIP from private R2
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          python - <<'PY'
          from networkpulse.evaluation.native_cross_dataset_sources import _archives
          from networkpulse.evaluation.private_r2_sources import (
              _configured_client, stream_verified_object,
          )
          archive = _archives()[0]
          if archive.name != "unsw-source.zip":
              raise SystemExit("Approved UNSW source missing")
          stream_verified_object(_configured_client(), archive)
          print("Actual UNSW source verified by full SHA-256")
          PY
      - name: Obtain previously exposed IoT-23v2 source by exact public SHA
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from networkpulse.evaluation.iot23v2_source_adapter import SOURCE_URL
          from networkpulse.evaluation.iot23v2_exact_runtime_recheck import (
              SOURCE_BYTES, SOURCE_SHA256,
          )
          with urlopen(Request(SOURCE_URL, headers={
              "User-Agent": "NetworkPulse-AI-research/1.0"
          }), timeout=120) as response:
              if response.status != 200:
                  raise SystemExit("Official research source HTTP error")
              data = response.read(SOURCE_BYTES + 1)
          if len(data) != SOURCE_BYTES or hashlib.sha256(data).hexdigest() != SOURCE_SHA256:
              raise SystemExit("IoT-23 raw source bytes do not match approved upload")
          fd = os.open("private-iot23v2.labeled", os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, "wb") as output:
              output.write(data)
          print("Original already-exposed IoT source matched exact SHA")
          PY
      - name: Train immutable V2 RF with real missingness-aware source flows
        run: >-
          python -m networkpulse.evaluation.v2_mixed_source_freeze
          --unsw-zip unsw-source.zip
          --iot23v2-labeled private-iot23v2.labeled
          --unsigned-model private-model/research-v2-model.joblib
          --manifest aggregate-evidence/research-v2-freeze-manifest.json
      - name: Verify real model lineage with NO-GO release decision
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from networkpulse.evaluation.unsw_to_toniot import digest
          from networkpulse.feature_contract_v2 import V2_FEATURE_CONTRACT
          model = Path("private-model/research-v2-model.joblib")
          manifest = json.loads(Path("aggregate-evidence/research-v2-freeze-manifest.json").read_text())
          if manifest.get("status") != "mixed_exposed_source_v2_research_model_frozen":
              raise SystemExit("V2 source training did not produce frozen research model")
          if digest(model) != manifest.get("artifact_sha256"):
              raise SystemExit("V2 trained model SHA mismatch")
          if manifest["protocol"]["feature_contract"] != V2_FEATURE_CONTRACT:
              raise SystemExit("V2 model and sensor contract differ")
          if manifest["iot23_training_rows"] != 23145:
              raise SystemExit("Source family coverage incomplete")
          if manifest["iot23_rows_with_missing_numeric"] != 17824:
              raise SystemExit("Incorrect missingness training support")
          if manifest["production_signed"] is not False or manifest["independent_test_performed"] is not False:
              raise SystemExit("Unverified model promotion attempted")
          print("Real V2 source training verified; independent acceptance NOT demonstrated")
          PY
      - name: Preserve aggregate-only V2 model lineage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-mixed-source-freeze-manifest-research-only
          path: aggregate-evidence/research-v2-freeze-manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve unsigned V2 research bundle (not deployed)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-v2-mixed-source-rf-research-only
          path: private-model/research-v2-model.joblib
          retention-days: 30
          if-no-files-found: error
      - name: Erase private labeled source and temporary model
        if: always()
        run: |
          rm -f unsw-source.zip private-iot23v2.labeled
          rm -f private-model/research-v2-model.joblib

# No raw IP flow artifacts, threshold tuning on a holdout, or production release.
