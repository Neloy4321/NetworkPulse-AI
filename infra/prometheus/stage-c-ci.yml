# Disposable Stage C CI ONLY. Never mounted into product deployments.
global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files:
  - /etc/prometheus/stage-c-ci-alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: networkpulse-stage-c-fixture
    metrics_path: /metrics
    static_configs:
      - targets: ['fixture:8080']
